name: Release
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Type of release to create"
        required: true
        default: "minor_release"
        type: choice
        options:
          - "minor_release"
          - "major_branch"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Tags the next version (per .version-line) and creates the GitHub release, so consumers can pin
      # `prova-rs/prova-<name>@vX.Y.Z`. Same reusable action archetypes release with.
      #
      # PROVA_DISPATCH_TOKEN, not GITHUB_TOKEN, and that choice is load-bearing: the action creates the
      # release with `gh release create` under whatever token it is handed, and GitHub refuses to let an
      # event created by GITHUB_TOKEN trigger another workflow. Handed the default token, this job
      # publishes a release authored by github-actions[bot] that register.yml never sees — the hop is
      # silently dead and registration falls back to reconcile's 6-hour loop. A PAT-authored release
      # fires it. (The tag push is unaffected either way; that uses the checkout's own credentials,
      # which is why `permissions: contents: write` above is still required.)
      - name: Create Release
        uses: archetect-actions/repository-release@v1
        with:
          release_type: ${{ github.event.inputs.release_type }}
          github_token: ${{ secrets.PROVA_DISPATCH_TOKEN }}
