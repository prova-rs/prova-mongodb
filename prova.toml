# One manifest, two hats. This package both exports a namespace (a package — `[package]`) and runs
# its own proofs (a suite). A consumer instead pins it by source — a released tag:
#   mongodb = { git = "https://github.com/prova-rs/prova-mongodb", tag = "v1.0" }
[package]
name        = "mongodb"
entry       = "mongodb.lua"
description = "MongoDB — docker-exec over the mongosh CLI, zero native code"
license     = "MIT"

# The range of prova versions this package is built against; a consumer is checked against it.
[requires]
prova = ">= 0.16"

[run]
proofs = ["tests"]

# Resolve THIS package from its own directory, so the self-tests can `require("mongodb")` exactly
# as a consumer would.
[dependencies]
mongodb = { path = "." }
